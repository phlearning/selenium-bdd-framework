cucumber.glue=io.github.phlearning.bdd
cucumber.snippet-type=camelcase
cucumber.publish.quiet=true
# Reporting plugins are declared on each runner (first pass / rerun write different files).

# --- Parallel execution: one scenario per thread -------------------------------
# Thread count is overridden by Maven with -Dthreads=N (see pom.xml).
cucumber.execution.parallel.enabled=true
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.config.fixed.parallelism=4
cucumber.execution.parallel.config.fixed.max-pool-size=4

# Scenarios tagged @sequential run alone: no other scenario runs at the same time.
cucumber.execution.exclusive-resources.sequential.read-write=org.junit.platform.engine.support.hierarchical.ExclusiveResource.GLOBAL_KEY
