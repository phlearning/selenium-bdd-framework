# Applications under test.
# saucedemo: public demo shop. Credentials are NOT stored here: set SAUCE_USERNAME /
# SAUCE_PASSWORD in the environment, in GitHub secrets or in the local .env file.
saucedemo.url=https://www.saucedemo.com
# the-internet: technical cases, run locally with `docker compose up -d`.
the-internet.url=http://localhost:7080
# dummyjson: public REST API (authentication, products). Credentials in DUMMYJSON_USERNAME /
# DUMMYJSON_PASSWORD, like saucedemo's.
dummyjson.url=https://dummyjson.com
