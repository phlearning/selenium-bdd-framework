# Default values. Any key can be overridden by -Dkey=value, by the KEY_NAME
# environment variable or by the local .env file (see .env.example).

# Active environment: loads config/environments/<env>.properties
env=demo

# Browser: chrome | firefox
browser=chrome
headless=false
window.width=1920
window.height=1080

# Timeouts in seconds
timeout.explicit=10
timeout.page.load=30

# Where browsers run: local (started on this machine) | grid (Selenium Grid, see docker-compose.yml)
execution=local
grid.url=http://localhost:4444

# Grid only: record a video of each session (not possible with headless browsers).
# Videos of failed scenarios are attached to the report.
video=false
video.dir=.grid/videos
# Seconds to wait for the recorder to finalise a video after the browser quit
timeout.video=30

# WebDriver BiDi: collects JavaScript errors and failed requests of every browser (attached to
# the report of failed scenarios) and allows network interception.
bidi=true
# Browser errors containing one of these texts (comma-separated) are known noise and ignored:
# the-internet embeds an Optimizely tracker that Firefox reports as blocked (CORS).
console.ignore=log.optimizely.com

# Local downloads land in <downloads.dir>/<random>/ (one folder per browser)
downloads.dir=target/downloads

# Demo mode: outlines each element before using it and pauses demo.delay ms, so that the
# browser (or its Grid video) can be followed by a person. Slows every scenario down.
demo=false
demo.delay=700

# Visual regression (Grid only): one baseline per browser, <visual.baselines.dir>/<browser>/<name>.png.
# -Dvisual.update=true writes the baselines instead of comparing.
visual.baselines.dir=src/test/resources/visual
visual.actual.dir=target/visual
visual.update=false
# A pixel differs when a colour channel moves by more than visual.tolerance (0-255);
# the page differs when more than visual.max.differing.ratio of its pixels do.
visual.tolerance=16
visual.max.differing.ratio=0.001
