# Default values. Any key can be overridden by -Dkey=value, by the KEY_NAME
# environment variable or by the local .env file (see .env.example).

# Active environment: loads config/environments/<env>.properties
env=demo

# Browser: chrome | firefox
browser=chrome
headless=false
window.width=1920
window.height=1080

# Timeouts in seconds
timeout.explicit=10
timeout.page.load=30
