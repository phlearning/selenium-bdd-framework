# Fast feedback on every push to main and every pull request: @smoke scenarios, headless Chrome.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write

jobs:
  # Formatting and coding rules: fails fast, before any browser starts.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Formatting (fix locally with ./mvnw spotless:apply)
        run: ./mvnw -B spotless:check
      - name: Coding rules
        run: ./mvnw -B checkstyle:check
      - name: Compilation
        run: ./mvnw -B test-compile

  smoke:
    needs: quality
    uses: ./.github/workflows/run-tests.yml
    with:
      browser: chrome
      tags: "@smoke"
      execution: local
      threads: 4
      report-name: smoke-chrome
    secrets:
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}
      DUMMYJSON_USERNAME: ${{ secrets.DUMMYJSON_USERNAME }}
      DUMMYJSON_PASSWORD: ${{ secrets.DUMMYJSON_PASSWORD }}
